{{- $roleName := "reviewer" }}
{{- range list "frontend" "backend" "database" }}
{{- $app := index $.Values . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $app.serviceAccount.name }}
  labels:
    app: {{ $app.label }}

---
{{- end }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $roleName }}
  labels:
    app: {{ $roleName }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [ "apps" ]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $roleName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
